<line x1="70" y1="222" x2="700" y2="222" stroke="#16130E" stroke-width="3"/>
<text x="70" y="286" font-family="'IBM Plex Mono', monospace" font-size="25" fill="#16130E">THE FREE DAILY CHECK-IN COMPANION</text>
<text x="70" y="330" font-family="'IBM Plex Mono', monospace" font-size="25" fill="#16130E">BNB CHAIN &#183; AGENT ID HOLDERS ONLY</text>
<text x="70" y="452" font-family="'IBM Plex Mono', monospace" font-size="26" fill="#6F695B">agentdraw.click</text>
