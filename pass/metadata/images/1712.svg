<text x="862" y="330" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="52" fill="#16130E">#1712</text>
<!-- the single signal-orange accent: the FREE stamp on the stub -->
<g transform="rotate(-14 862 448)">
<rect x="782" y="416" width="160" height="62" fill="none" stroke="#FF4A1C" stroke-width="5"/>
<text x="862" y="459" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="6" fill="#FF4A1C">FREE</text>
