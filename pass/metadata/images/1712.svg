<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect x="0" y="0" width="1000" height="560" fill="#F4F1EA"/>
<rect x="18" y="18" width="964" height="524" fill="none" stroke="#16130E" stroke-width="6"/>
<rect x="34" y="34" width="932" height="492" fill="none" stroke="#16130E" stroke-width="2"/>
<!-- perforation between the ticket body and the stub -->
