<circle cx="742" cy="542" r="17" fill="#FFFFFF"/>
<circle cx="742" cy="18" r="17" fill="none" stroke="#16130E" stroke-width="4"/>
<circle cx="742" cy="542" r="17" fill="none" stroke="#16130E" stroke-width="4"/>
<!-- main field -->
<text x="70" y="128" font-family="Archivo, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="2" fill="#16130E">AGENTDRAW</text>
