<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- AgentDraw mark: an ink ticket stub on transparent paper.
       Semicircular perforation notches bite both short sides, a punched
       circle is knocked out of the body, a dashed perforation column
       separates the stub, and one signal-orange dot sits in the stub.
       True cutouts (mask), chunky geometry — reads clearly at 36px. -->
  <defs>
    <mask id="ticket-punch" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="6" y="22" width="88" height="56" rx="10" fill="#fff"/>
      <circle cx="6" cy="50" r="8" fill="#000"/>
      <circle cx="94" cy="50" r="7.5" fill="#000"/>
      <circle cx="38" cy="50" r="9.5" fill="#000"/>
      <rect x="64.6" y="29" width="3.6" height="5" fill="#000"/>
      <rect x="64.6" y="37" width="3.6" height="5" fill="#000"/>
      <rect x="64.6" y="45" width="3.6" height="5" fill="#000"/>
      <rect x="64.6" y="53" width="3.6" height="5" fill="#000"/>
      <rect x="64.6" y="61" width="3.6" height="5" fill="#000"/>
    </mask>
  </defs>
  <rect x="6" y="22" width="88" height="56" rx="10" fill="#16130E" mask="url(#ticket-punch)"/>
  <circle cx="80" cy="50" r="5" fill="#FF4A1C"/>
</svg>
